<!DOCTYPE html>
<html lang="en">
<head>
  <img id="trainImg" src="train.png" style="display:none">
<img id="playerImg" src="player.png" style="display:none">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Bali - By Naveed Aziz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a8ff">
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#87CEEB;overflow:hidden;font-family:Arial;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;max-width:480px;margin:0 auto;background:linear-gradient(#87CEEB 0%, #ffe4b5 100%);overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  <img id="train" src="train.png" style="display:none">
<img id="player" src="player.png" style="display:none">
#ui{position:absolute;top:0;width:100%;padding:10px;display:flex;justify-content:space-between;z-index:10;color:white;font-weight:bold;text-shadow:2px 2px 0 #000}
.badge{background:rgba(0,0,0,0.6);padding:8px 14px;border-radius:20px}
#overlay{position:absolute;inset:0;background:linear-gradient(#0f2a5a,#1a4a8a);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}
.logo{font-size:42px;font-weight:900;color:#ffcc00;-webkit-text-stroke:3px #000;text-shadow:4px 4px 0 #c0392b;line-height:0.9}
.logo span{color:white}
.bar{width:80%;height:22px;background:#000;border-radius:10px;margin:20px 0;overflow:hidden;border:2px solid #fff}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#ff6a00,#ffcc00);transition:width 0.2s}
button{padding:16px 40px;border:none;border-radius:30px;font-size:20px;font-weight:900;background:#ffcc00;color:#000;box-shadow:0 4px 0 #c0392b;margin-top:20px}
#installBtn{background:white;display:none}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div class="badge">💰 <span id="coins">0</span></div><div class="badge">🏃 <span id="score">0</span></div></div>
<canvas id="c"></canvas>
<div id="overlay">
<div class="logo">SUBWAY<br><span>SURFERS</span><br><div style="font-size:22px;color:#ff6a00;margin-top:5px">BALI</div></div>
<div class="bar"><div id="fill"></div></div>
<div id="loadText">Loading 0%</div>
<h3 style="margin-top:10px">BY NAVEED AZIZ</h3>
<button id="playBtn" style="display:none">PRESS TO PLAY</button>
<button id="installBtn">INSTALL GAME - OFFLINE</button>
<p style="margin-top:15px;font-size:12px;opacity:0.8">Swipe Left/Right • Tap to Jump • Swipe Down to Roll<br>Offline chalegi - Net nahi lagega!</p>
</div>
</div>
<script src="script.js"></script>
<script>
let deferredPrompt;const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
<img id="train" src="train.png" style="display:none">
<img id="player" src="player.png" style="display:none">
