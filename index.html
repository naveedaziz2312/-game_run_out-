<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Subway Surfers - By Naveed Aziz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#ffcc00">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <div id="top-bar">
    <div class="badge" id="score">💰 0</div>
    <div class="badge" id="level">Lvl 1</div>
    <div class="badge" id="pauseBtn">⏸️</div>
  </div>

  <div id="track">
    <div class="wall wall-left"></div>
    <div class="wall wall-right"></div>
    <div class="rail-area">
      <div class="lane" id="lane0"></div>
      <div class="lane" id="lane1"></div>
      <div class="lane" id="lane2"></div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="overlay" style="display:flex;">
    <h1 style="color:#ffcc00;">SUBWAY SURFERS</h1>
    <h3 style="color:#fff;">BY NAVEED AZIZ</h3>
    <p style="margin:10px;">🏃 Swipe Left/Right • Tap to Jump</p>
    <button id="playBtn">▶️ PLAY NOW</button>
    <button id="installBtn" style="background:#fff;color:#000;display:none;">📲 INSTALL GAME</button>
    <p style="margin-top:15px;font-size:12px;opacity:0.7;">Icon: Aapki Photo Wala</p>
  </div>

  <!-- Pause Menu -->
  <div id="pauseMenu" class="overlay">
    <h1>⏸️ PAUSED</h1>
    <div class="setting-item">
      <span>🐢 Speed Kam/Zyada</span>
      <input type="range" id="speedControl" min="0.5" max="3" step="0.1" value="1">
      <span id="speedValue">1x</span>
    </div>
    <div class="setting-item"><span>Level</span><span id="levelInfo">1</span></div>
    <div class="setting-item"><span>Best Score</span><span id="bestInfo">0</span></div>
    <button id="resumeBtn">▶️ RESUME</button>
    <div class="row">
      <button id="restartBtn2">🔄 RESTART</button>
      <button id="shareBtn2">📤 SHARE</button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameOver" class="overlay">
    <h1>💥 GAME OVER</h1>
    <h2 id="finalScore">Score: 0</h2>
    <h3 id="highScore">Best: 0</h3>
    <p style="color:#ffcc00;">BY NAVEED AZIZ</p>
    <button id="restartBtn">🔄 PLAY AGAIN</button>
    <button id="shareBtn">📤 SHARE WITH FRIENDS</button>
  </div>
</div>

<script src="script.js"></script>
<script>
// PWA Install
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';});
installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
